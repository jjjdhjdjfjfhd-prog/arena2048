const tr=(k,...a)=>{let s=(D[k]||[k,k])[lang==="en"?1:0];a.forEach((v,i)=>{s=s.split("{"+i+"}").join(v)});return s};

// ===== บัญชีและยอด =====
let initializeApp,getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,getFirestore,doc,getDoc,setDoc,updateDoc,serverTimestamp,collection,query,where,orderBy,getDocs,limit,writeBatch,auth=null,db=null,FB=false,FBFAIL=false;
let U=null,bal=0;
function paint(){$("balbar").hidden=!U;$("bal").textContent=nf(bal);$("ui").textContent=U?tr("uiIn",U.email):(FBFAIL?tr("uiOff"):tr("uiOut"))}
async function refreshBal(){if(!U)return;try{const s=await getDoc(doc(db,"users",U.uid));if(s.exists())bal=s.data().bal||0}catch(e){}paint()}
function authStart(){onAuthStateChanged(auth,async u=>{U=u;bal=0;
 if(u){const ref=doc(db,"users",u.uid);try{let s=await getDoc(ref);if(!s.exists()){await setDoc(ref,{email:u.email,bal:0,createdAt:serverTimestamp()});s=await getDoc(ref)}bal=s.data().bal||0}catch(e){toast(tr("acF",e.code))}}
 paint();wd();lb()})}
$("ub").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("ue").value.trim(),$("up").value);say("um",tr("okIn"))}catch(e){say("um",errMsg(e))}};

 try{const q=await getDocs(query(collection(db,"withdrawals"),where("uid","==",U.uid),limit(5)));
  q.forEach(x=>{const w=x.data(),r=el("div",undefined,"row");r.append(el("span",nf(w.a)+" PEPE → "+w.fp),el("span",w.st==="paid"?tr("paid"):tr("pend"),"mute"));L.append(r)})}catch(e){}}

 if(!/^\S+@\S+\.\S+$/.test(e)||a<MIN_WD||a>bal){m(tr("wdBad",nf(MIN_WD)));return}

const cv=$("cv"),cx=cv.getContext("2d"),wrap=$("wrap"),fsb=$("fsb"),W=360,GR=40,GAP=150,PW=56,SP=2.2,BX=90,BR=10,GRAV=0.32,JUMP=-6.2,VMAX=7;
let H=480,fs=false,st="gate",by=0,vy=0,P=[],last=0,lastT=0,score=0,over=false,revives=0,gs="open";

function fit(){let w="",h="";
 if(!fs)H=480;else{const vw=innerWidth,vh=innerHeight;H=Math.max(420,Math.min(900,Math.round(W*vh/vw)));const a=W/H;let cw=vw,ch=vw/a;if(ch>vh){ch=vh;cw=vh*a}w=cw+"px";h=ch+"px"}
 cv.style.width=w;cv.style.height=h;cv.width=W*2;cv.height=H*2;cx.setTransform(2,0,0,2,0,0);
 by=Math.min(by,H-GR-30);P.forEach(p=>{p.t=Math.max(60,Math.min(p.t,H-GR-GAP-60))})}
function setFs(on){if(on===fs)return;fs=on;wrap.classList.toggle("fs",on);document.body.style.overflow=on?"hidden":"";fsb.textContent=tr(on?"fsx":"fs");
 if(on&&wrap.requestFullscreen)wrap.requestFullscreen().catch(()=>{});

 cx.fillStyle="#111";cx.beginPath();cx.arc(6,-4,2,0,7);cx.fill();
 cx.fillStyle="#f4a261";cx.fillRect(8,2,8,5);cx.restore();
 const sy=fs?100:70;cx.textAlign="center";cx.font="700 40px Prompt,system-ui,sans-serif";cx.lineWidth=5;cx.strokeStyle="#14213d";cx.strokeText(score,W/2,sy);cx.fillStyle="#fff";cx.fillText(score,W/2,sy);
 if(st==="ready")label(tr("tapS"));else if(st==="wait")label(tr("tapC"))}
